<!DOCTYPE html>
<html>

  <head>
    <title>Sign-up form</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>

  <body>

    <div class="container">
      
      <div class="sidebar">
        <div class="logo">Dashboard</div>

        <ul class="nav">
          <li>Home</li>
          <li>Profile</li>
          <li>Messages</li>
          <li>History</li>
          <li>Tasks</li>
          <li>Communities</li>
        </ul>

        <ul class="options">
          <li>Settings</li>
          <li>Support</li>
          <li>Privacy</li>
        </ul>
      </div>
      
      <div class="main">

        <div class="header"> 
          <div class="search-bar">
            <input type="search" id="search" name="search-bar"/>
          </div> 
             
          <img src="idk" alt="Bell">

          <div class="profile">My Name</div>

          <div class="greeting">
            <img src="idk" alt="Logo">
            <p>Hi there</p>
            <p id="name">General Kenobi</p>
          </div>

          <div class="nav-buttons">
            <button class="new-btn">New</button>

            <button class="upload-btn">Upload</button>
            
            <button class="share-btn">Share</button>
          </div>
        </div>

        <div class="content"> 


        </div>

      </div>


    </div>

  </body>


</html>
